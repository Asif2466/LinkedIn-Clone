server:
  port: 8800

jwt:
  secret-key: my-secret-key


spring:
  application:
    name: api_gateway
  data: #Redis Configuration
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            #Auth routes - No JWT authentication required
            - id: auth_service
              uri: http://localhost:8081
              predicates:
                - Path =/api/v1/auth/**

            #User service routes - JWT authentication required
            - id: user_service
              uri: http://localhost:8081
              predicates:
                    - Path =/api/v1/users/**
              filters:
                - name: JwtAuthFilter

            #Post service routes - JWT authentication required
            - id: post_service
              uri: http://localhost:8082
              predicates:
                - Path =/api/v1/posts/**
              filters:
                - name: JwtAuthFilter

            #Feed service routes - JWT authentication required
            - id: feed_service
              uri: http://localhost:8083
              predicates:
                - Path =/api/v1/feeds/**
              filters:
                - name: JwtAuthFilter

            #Search service routes - JWT authentication required
            - id: search_service
              uri: http://localhost:8084
              predicates:
                - Path =/api/v1/search/**
              filters:
                - name: JwtAuthFilter
management:
  endpoints:
    web:
      exposure:
        include: health, info

