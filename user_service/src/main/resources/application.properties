spring.application.name=user_service
server.port=8080


#MySQL Database properties
spring.datasource.url=jdbc:mysql://localhost:3306/linkedin_user_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Kafka consumer properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=account-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

# jwt-configuration
jwt.secret-key=my-secret-key
jwt.expiration=86400000    #24 hours in milliseconds
jwt.refresh-expiration=604800000  #7 days in milliseconds

#AWS-configuration
aws.access-key=
aws.secret-key=
aws.region=
aws.s3.bucket-name=


#health
management.endpoints.web.exposure.include=health,info