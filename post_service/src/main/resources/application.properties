spring.application.name=post_service
server.port=8081


#MySQL Database properties
spring.datasource.url=jdbc:mysql://localhost:3306/linkedin_post_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Kafka producer properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#health
management.endpoints.web.exposure.include=health,info

#AWS configuration
aws.access-key= my-aws-key
aws.secret-key=my-aws-secret-key
aws.s3.bucket-name= my-aws-bucket-name
aws.region=AP_SOUTH_1
